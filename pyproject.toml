[project]
name = "mathematics-ai-atp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "faiss-cpu>=1.14.2",
    "graphviz>=0.21",
    "pantograph-async-client @ git+https://github.com/Leul-Negash/Pantograph-Client@455f8a352d9d72a796e5b3e5cedf643c0909f954",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "torch>=2.12.0",
    "torch-geometric>=2.7.0",
]


[tool.setuptools.packages.find]
where=["."]
include=["maths_ai", "maths_ai.*"]
exclude=["data", "experiments", "tests", "tests.*"]


[dependency-groups]
dev = ["pytest>=9.0.3"]
